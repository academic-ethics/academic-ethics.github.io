project:
  type: website
  output-dir: _site

lang: ja
language:
  title-block-published: "開催日"
  search-label: "検索"
  search-text-placeholder: "サイト内を検索"
  listing-page-no-matches: "予定はありません"

website:
  # TODO: 研究会の正式名称（日本語名）が決まったら title と description を差し替える
  title: "Academic Ethics"
  description: "Academic Ethics 研究会のウェブサイト（説明文は仮）"
  site-url: "https://academic-ethics.github.io"
  # 下書き（draft: true）のページは公開サイトから除外する。quarto preview --profile drafts では表示される
  draft-mode: gone
  navbar:
    search: true
    left:
      - text: "ホーム"
        href: index.qmd
      - text: "開催案内"
        href: events.qmd
      - text: "開催記録"
        href: archive.qmd
      - text: "研究会について"
        href: about.qmd
  page-footer:
    left: "© Academic Ethics"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    # 各ページは短いので目次は付けない（目次の見出しが本文の見出しより前に来るのも避ける）
    toc: false
    # 見出し横の小さなリンク記号は付けない（英語の読み上げ名と小さい操作対象を避ける）
    anchor-sections: false
    include-after-body: _includes/search-label.html
